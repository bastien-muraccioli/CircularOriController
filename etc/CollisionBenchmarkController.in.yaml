---
# If true, the FSM transitions are managed by an external tool
Managed: false
# If true and the FSM is self-managed, transitions should be triggered
StepByStep: true
# Change idle behaviour, if true the state is kept until transition,
# otherwise the FSM holds the last state until transition
IdleKeepState: false
# Where to look for state libraries
StatesLibraries:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
# Where to look for state files
StatesFiles:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
# If true, state factory will be more verbose
VerboseStateFactory: false
# Additional robots to load
robots:
  ground:
    module: env/ground

# Collision constraint
collisions:
  - type: collision
    useMinimal: true

ObserverPipelines:
  - name: Pipeline
    observers:
      - type: Encoder
        config:
          velocity: encoderVelocities

# Implement some additional text states
states: {}

# Transitions map
transitions:
  # Forward
  - [CollisionBenchmarkController_Initial, Forward, CollisionBenchmarkController_Forward, Strict]
  - [CollisionBenchmarkController_Forward, OK, CollisionBenchmarkController_ReactionSimple, Auto]

  # LastJointsRotation
  - [CollisionBenchmarkController_Initial, LastJointsRotation, CollisionBenchmarkController_LastJointsRotation, Strict]
  - [CollisionBenchmarkController_LastJointsRotation, OK, CollisionBenchmarkController_ReactionSimple, Auto]

  # Big Rotate
  - [CollisionBenchmarkController_Initial, FirstJointRotation, CollisionBenchmarkController_FirstJointRotation_InitialPose, Strict]
  - [CollisionBenchmarkController_FirstJointRotation_InitialPose, OK, CollisionBenchmarkController_FirstJointRotation, Auto]
  - [CollisionBenchmarkController_FirstJointRotation, OK, CollisionBenchmarkController_ReactionSimple, Auto]

  # Pick Place
  - [CollisionBenchmarkController_Initial, PickPlace, CollisionBenchmarkController_PickPlace_InitialPose, Strict]
  - [CollisionBenchmarkController_PickPlace_InitialPose, OK, CollisionBenchmarkController_PickPlace, Auto]
  - [CollisionBenchmarkController_PickPlace, OK, CollisionBenchmarkController_ReactionSimple, Auto]

  # Reactions
  - [CollisionBenchmarkController_ReactionSimple, OK, CollisionBenchmarkController_Initial, Auto]
  
# Initial state
init: CollisionBenchmarkController_Initial

# Plugins for simulation
Plugins: [TorqueResidual, EnergyResidualTorque, EnergyResidualCurrent, CurrentResidual, CollisionDetectionZurlo, CollisionDetectionJerk, CollisionDetectionMomentumError, CollisionDetectionPiSliding, SuperTwisting, CollisionDetectionForceTorqueSensor, ADCCollisionSensor]
# Plugins for deployment on real robot
# Plugins: [RosImuSensor, RosForceSensor, TorqueResidual, EnergyResidualTorque, EnergyResidualCurrent, CurrentResidual, CollisionDetectionZurlo, CollisionDetectionJerk, CollisionDetectionMomentumError, CollisionDetectionPiSliding, SuperTwisting, CollisionDetectionForceTorqueSensor, ADCCollisionSensor]
